<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>退款审批 · 门店工作台</title>
<style id="refund-ui">
:root {
  color-scheme: light;
  --paper:#f5f5ef; --card:#fff; --ink:#183e33; --muted:#53695e;
  --line:#cbd5cb; --brand:#14583e; --pending-bg:#fff0c9; --pending-ink:#754900;
  --done-bg:#dcf0e3; --done-ink:#145239; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.topbar,.row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar{height:64px;background:var(--ink);color:white;padding:0 max(32px,calc((100% - 1040px)/2))}
.wrap{width:min(1040px,calc(100% - 64px));margin:42px auto}
.eyebrow,.mono{font:600 12px/1.5 ui-monospace,monospace;letter-spacing:.08em}
.eyebrow{color:var(--muted)}
h1,h2,p,dl,dd{margin:0}
h1{font-size:36px;letter-spacing:-.04em}
h2{font-size:19px}
.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;margin-top:24px;align-items:start}
.panel{padding:28px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.badge{display:inline-flex;align-items:center;gap:8px;border-radius:100px;padding:4px 12px;font-size:14px;font-weight:650;background:var(--pending-bg);color:var(--pending-ink)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.done{background:var(--done-bg);color:var(--done-ink)}
.metric{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.facts{border-top:1px solid var(--line);margin-top:20px}
.facts>div{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
dt,.note{color:var(--muted)}
.note{font-size:14px}
.action{display:block;text-align:center;margin-top:20px;padding:12px;border:0;border-radius:8px;background:var(--brand);color:white;font:inherit;font-weight:650;width:100%}
.screen{min-height:800px}
.intro{margin-top:8px}
.amount{margin-top:18px}
.handoff{border-top:1px solid var(--line);padding:24px 0;color:var(--muted)}
@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{width:calc(100% - 32px)}.topbar{padding:0 16px}}
</style>
<style>button.action{cursor:pointer}</style>
</head>
<body>
<div class="screen">
  <header class="topbar"><strong>门店工作台</strong><span>当前身份 · 主管</span></header>
  <main class="wrap">
    <p class="eyebrow">门店运营 / 交班单据</p>
    <h1>退款审批</h1>
    <p class="note intro">先核对单号、门店和金额，再确认审批状态。</p>
    <div class="grid">
      <section class="panel">
        <p class="eyebrow">01 / 退款单号</p>
        <h2 style="font:700 32px/1.5 ui-monospace,monospace">R-17</h2>
        <p>青禾路店</p>
        <div class="amount"><p class="note">退款金额</p><p class="metric">¥28.00</p></div>
        <dl class="facts"><div><dt>退款原因</dt><dd>配送少了一盒餐</dd></div></dl>
      </section>
      <section class="panel" id="approval">
        <p class="eyebrow">02 / 审批</p>
        <div class="row"><h2>处理状态</h2><span class="badge" role="status">待审</span></div>
        <p class="note intro">核对无误后，由主管批准本单退款。</p>
      </section>
    </div>
  </main>
</div>
<script>
const params = new URLSearchParams(location.search);
const manager = params.get('role') !== 'service';
const storageKey = 'refund-delivery:build-v2:R-17';
const panel = document.querySelector('#approval');
const badge = panel.querySelector('.badge');
const note = panel.querySelector('.intro');
const pendingNote = note.textContent;
document.querySelector('.topbar span').textContent = `当前身份 · ${manager ? '主管' : '客服'}`;

function isDone() {
  return params.get('state') === 'done' || localStorage.getItem(storageKey) === 'done';
}
function render() {
  const done = isDone();
  badge.textContent = done ? '已处理' : '待审';
  badge.classList.toggle('done', done);
  note.textContent = done ? '本单退款已处理，无需再次审批。' : pendingNote;
  const button = panel.querySelector('button');
  if (!manager || done) {
    button?.remove();
  } else if (!button) {
    const approve = document.createElement('button');
    approve.type = 'button';
    approve.className = 'action';
    approve.textContent = '批准退款';
    approve.addEventListener('click', () => {
      if (!isDone()) localStorage.setItem(storageKey, 'done');
      render();
    });
    panel.append(approve);
  }
}
window.addEventListener('pageshow', render);
window.addEventListener('storage', event => {
  if (event.key === storageKey || event.key === null) render();
});
render();
</script>
</body>
</html>
