<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R-17 · 交班三步演示</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5ef;color:#183e33;font:16px/1.65 system-ui,sans-serif}
main{width:min(960px,calc(100% - 32px));margin:32px auto}
header,nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header{border-bottom:1px solid #becdc0;padding-bottom:16px}
.stage{display:grid;grid-template-columns:1fr 1fr;border-radius:16px;overflow:hidden;margin:24px 0;background:#183e33;color:white}
.story,.ticket{padding:clamp(24px,4vw,46px)}
.ticket{background:white;color:#183e33;border:1px solid #cbd5cb;border-radius:0 16px 16px 0}
h1{font-size:clamp(30px,4vw,44px);line-height:1.2;margin:20px 0}
.index{color:#d5eabd;font:bold 20px ui-monospace,monospace}
h2,p,dl,dd{margin:0}
.tag{font-size:14px;color:#53695e}
dl>div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #d5ddd4}
dt{color:#53695e}
.stamp{font-weight:bold}
.sample{background:#14583e;color:white;border-radius:8px;padding:8px 14px;text-align:center;margin-top:16px}
.result{margin-top:14px}
button{font:inherit;color:inherit;background:white;border:1px solid #a6b7aa;padding:9px 16px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
#next{background:#183e33;color:white}
footer{margin-top:24px;color:#53695e;font-size:14px}
@media(max-width:650px){.stage{grid-template-columns:1fr}.ticket{border-radius:0 0 16px 16px}}
</style>
</head>
<body>
<main>
  <header><strong>交班演示 / 退款审批</strong><span>业务讲解 · 3 步</span></header>
  <div class="stage" aria-live="polite">
    <section class="story"><p id="index" class="index">01 / 03</p>
      <h1 id="title">客服查单</h1><p id="story">小禾先核对单号、门店和金额。状态是「待审」，客服可以向顾客说明进度，但不能批准。</p>
    </section>
    <section class="ticket"><p class="tag">退款单号</p><h2>R-17</h2>
      <dl><div><dt>门店</dt><dd>青禾路店</dd></div><div><dt>退款金额</dt><dd>¥28.00</dd></div>
        <div><dt>退款原因</dt><dd>配送少了一盒餐</dd></div><div><dt>处理状态</dt><dd class="stamp" id="state">待审</dd></div></dl>
      <p id="result" class="result">客服视图：只能查看</p>
      <p class="sample" id="sample" hidden>批准退款</p>
    </section>
  </div>
  <nav aria-label="演示翻页"><button type="button" id="prev" disabled>上一步</button><button type="button" id="next">下一步：主管审批</button></nav>
  <noscript>请启用 JavaScript 观看全部三步。</noscript>
  <footer>来源：<a href="brief.html">R-17 需求交接单</a>。本演示使用固定分镜，不是线上操作记录；翻页不会更改 <a href="prototype.html">原型</a> 中的单据。</footer>
</main>
<script>
const frames = [
  ['客服查单','小禾先核对单号、门店和金额。状态是「待审」，客服可以向顾客说明进度，但不能批准。','待审','客服视图：只能查看','下一步：主管审批'],
  ['主管批准','阿宁接手同一张单，核对 ¥28.00 和退款原因。只有主管在待审时能点「批准退款」。下一步看批准后的交班结果。','待审','主管视图：可执行的操作','观看批准结果'],
  ['交班复查','批准后，退款单标记为「已处理」。两种身份重新打开 R-17，看到的结果一致，都没有再次批准的入口。','已处理','客服：只能查看　｜　主管：不能再批','从头观看']
];
const el = id => document.getElementById(id);
let step = 0;
function show(i) {
  step = i;
  const [title,story,state,result,next] = frames[i];
  for (const [id,text] of Object.entries({title,story,state,result,next})) el(id).textContent = text;
  el('index').textContent = `0${i+1} / 03`;
  el('prev').disabled = i === 0;
  el('sample').hidden = i !== 1;
}
el('prev').onclick = () => show(Math.max(0,step-1));
el('next').onclick = () => show((step+1)%frames.length);
</script>
</body>
</html>
