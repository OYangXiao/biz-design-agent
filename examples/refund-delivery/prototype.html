<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R-17 · 退款审批原型</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5ef;color:#183e33;font:16px/1.6 system-ui,sans-serif}
header{background:#183e33;color:white;padding:16px max(20px,calc((100% - 840px)/2));display:flex;justify-content:space-between;gap:16px}
main{width:min(840px,calc(100% - 32px));margin:40px auto}
h1,h2,p,dl,dd{margin:0}
.kicker{font-size:13px;font-weight:700;color:#53695e;letter-spacing:.08em}
h1{margin:4px 0;font-size:32px}
.tools,article{margin-top:20px;border:1px solid #cbd5cb;border-radius:12px;background:white;padding:24px}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
select,button{border-radius:7px;padding:9px 16px;font:inherit}
select{background:white;color:inherit;border:1px solid #789084}
dl>div{display:grid;grid-template-columns:104px 1fr;gap:12px;border-top:1px solid #d8dfd7;padding:12px 0}
dl{margin:12px 0}
dt,footer{color:#53695e}
#state{font-weight:bold;color:#754900;background:#fff0c9;border-radius:20px;padding:3px 12px}
#state.done{color:#145239;background:#dcf0e3}
button{border:0;background:#14583e;color:white;font-weight:650;cursor:pointer;margin-top:12px}
footer{margin-top:16px;font-size:14px}
</style>
</head>
<body>
<header><strong>门店工作台</strong><span>交互原型 · 模拟</span></header>
<main>
  <p class="kicker">交班练习 / 单据审批</p><h1>退款审批</h1>
  <p>先以客服身份查单，再切换主管批准。刷新页面或切回客服，复查同一张单。</p>
  <div class="tools"><label for="role">模拟查看身份</label>
    <select id="role"><option>客服</option><option>主管</option></select>
  </div>
  <article>
    <p class="kicker">退款单号</p><h2>R-17</h2>
    <dl><div><dt>门店</dt><dd>青禾路店</dd></div>
      <div><dt>退款金额</dt><dd><strong>¥28.00</strong></dd></div>
      <div><dt>退款原因</dt><dd>配送少了一盒餐</dd></div>
      <div><dt>处理状态</dt><dd><span id="state">待审</span></dd></div>
    </dl>
    <p id="hint" role="status"></p>
    <button id="approve" type="button" hidden>批准退款</button>
    <noscript>此原型需要启用 JavaScript 才能切换角色和模拟批准。</noscript>
  </article>
  <footer>本地模拟，不会发起真实退款。使用同一浏览器、同一路径重开可保留结果。重复讲解请用 <a href="demo.html">三步演示</a>。</footer>
</main>
<script>
const key = 'refund-delivery:prototype:R-17:v1';
const role = document.querySelector('#role');
const approve = document.querySelector('#approve');
const state = document.querySelector('#state');
const hint = document.querySelector('#hint');
function storageUnavailable() {
  approve.hidden = true;
  state.textContent = '无法读取或保存';
  hint.textContent = '当前浏览器不允许保存模拟进度。请允许本地存储，或改用三步演示。';
}
function render() {
  try {
    const done = localStorage.getItem(key) === 'done';
    state.textContent = done ? '已处理' : '待审';
    state.classList.toggle('done', done);
    approve.hidden = done || role.value !== '主管';
    hint.textContent = done ? '本单已处理，无需再次批准。' :
      approve.hidden ? '客服只能查看进度，待主管审批。' : '核对无误后，由主管批准本单退款。';
  } catch { storageUnavailable(); }
}
approve.addEventListener('click', () => {
  if (approve.hidden || role.value !== '主管') return;
  try {
    if (localStorage.getItem(key) !== 'done') localStorage.setItem(key, 'done');
    render();
  } catch { storageUnavailable(); }
});
role.addEventListener('change', render);
window.addEventListener('storage', render);
window.addEventListener('pageshow', render);
render();
</script>
</body>
</html>
